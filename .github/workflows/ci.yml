name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Verify
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Scan SDK and consumer baseline SBOMs with OSV
        if: matrix.java == '17'
        run: |
          python3 scripts/verify_osv_sbom.py agentscope-cls-observability-sdk/target/bom.json
          python3 scripts/verify_osv_sbom.py agentscope-cls-observability-sdk/target/bom-consumer.json
      - name: Build Javadoc
        run: ./mvnw --batch-mode --no-transfer-progress -pl agentscope-cls-observability-sdk javadoc:javadoc
      - name: Inspect SDK package
        shell: bash
        run: |
          jar_file=$(find agentscope-cls-observability-sdk/target -maxdepth 1 -name 'agentscope-cls-observability-sdk-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -1)
          test -n "$jar_file"
          jar tf "$jar_file" > /tmp/sdk-contents.txt
          ! grep -E '(^|/)(demo|test|测试信息|\.private|\.env)(/|$)' /tmp/sdk-contents.txt

  links:
    name: Documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --no-progress --exclude-mail --exclude '^https://console.cloud.tencent.com' './**/*.md'
          fail: true
