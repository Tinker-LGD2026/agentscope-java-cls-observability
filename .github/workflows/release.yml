name: GitHub Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  metadata:
    name: Release metadata gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify tag format, version match, notes and main ancestry
        run: python3 scripts/verify_release_metadata.py --tag "$GITHUB_REF_NAME" --main origin/main
      - name: Gitleaks full history
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_VERSION: 8.30.1

  build:
    name: Build and verify release (JDK ${{ matrix.java }})
    needs: metadata
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Verify release version
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${GITHUB_REF_NAME#v}"
          project_version=$(./mvnw --quiet help:evaluate -Dexpression=project.version -DforceStdout)
          test "$version" = "$project_version"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Build release artifacts
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Scan SDK and consumer baseline SBOMs with OSV
        run: |
          python3 scripts/verify_osv_sbom.py agentscope-cls-observability-sdk/target/bom.json
          python3 scripts/verify_osv_sbom.py agentscope-cls-observability-sdk/target/bom-consumer.json
      - name: Assemble release directory
        if: matrix.java == '17'
        shell: bash
        run: |
          mkdir -p dist
          cp "agentscope-cls-observability-sdk/target/agentscope-cls-observability-sdk-$RELEASE_VERSION.jar" dist/
          cp "agentscope-cls-observability-sdk/target/agentscope-cls-observability-sdk-$RELEASE_VERSION-sources.jar" dist/
          cp "agentscope-cls-observability-sdk/target/agentscope-cls-observability-sdk-$RELEASE_VERSION-javadoc.jar" dist/
          cp agentscope-cls-observability-sdk/target/bom.json dist/bom.json
          cp agentscope-cls-observability-sdk/target/bom-consumer.json dist/bom-consumer.json
          (cd dist && sha256sum -- * > SHA256SUMS)
      - name: Verify package contents
        if: matrix.java == '17'
        shell: bash
        run: |
          jar tf "dist/agentscope-cls-observability-sdk-$RELEASE_VERSION.jar" > /tmp/sdk-contents.txt
          ! grep -E '(^|/)(demo|test|测试信息|\.private|\.env)(/|$)' /tmp/sdk-contents.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.java == '17'
        with:
          name: github-release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/release-notes.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: github-release-assets
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --notes-file .github/release-notes.md --title "$GITHUB_REF_NAME"
