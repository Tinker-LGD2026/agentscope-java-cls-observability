[extend]
useDefault = true

[[allowlists]]
description = "Synthetic credential shapes used by sanitizer tests"
regexTarget = "match"
regexes = [
  '''AKIDabcdefghijklmnopqrstuvwxyz01''',
  '''sk-abcdefghijklmnopqrstuvwxyz012345''',
  '''Bearer aaaaaaaaaaaaaaaaaaaa'''
]

[[allowlists]]
description = "Synthetic PEM block used to verify redaction of private keys in tests"
rules = ['''private-key''']
paths = [
  '''agentscope-cls-observability-sdk/src/test/java/io/github/tinkerlgd2026/agentscope/cls/privacy/CanonicalPayloadCaptureTest.java'''
]
